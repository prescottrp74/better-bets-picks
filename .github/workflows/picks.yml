name: Weekend under picks

on:
  schedule:
    - cron: '0 7 * * 5'
    - cron: '0 7 * * 6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas scipy
      - name: Fetch data, refresh model, build picks page
        run: python fetch_and_run.py
      - name: Commit updated page
        run: |
          git config user.name  "picks-bot"
          git config user.email "actions@github.com"
          git add docs/ out/ data/new_2627.csv || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh picks ($(date -u +%Y-%m-%d))"
            git push
          fi
